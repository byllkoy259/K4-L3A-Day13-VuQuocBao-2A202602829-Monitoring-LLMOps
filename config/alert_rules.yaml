alerts:
  - name: high_latency_p95
    severity: P2
    condition: 'percentile(latency_ms, 95) over event == "response_sent" > 3000'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: "#day13-alerts"
    owner: vu-quoc-bao (on-call)
    slo: fast_successful_requests
    runbook: docs/alerts.md#alert-1
  - name: high_error_rate
    severity: P1
    condition: 'count(event == "request_failed") / count(event == "request_received") * 100 > 2'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: "#day13-alerts"
    owner: vu-quoc-bao (on-call)
    slo: fast_successful_requests
    runbook: docs/alerts.md#alert-2
  - name: cost_per_request_spike
    severity: P2
    condition: 'mean(cost_usd) over event == "response_sent" > 0.005'
    duration: 10m
    type: symptom-based
    channel: slack
    slack_channel: "#day13-alerts"
    owner: vu-quoc-bao (on-call)
    slo: guardrail_daily_cost_usd_max
    runbook: docs/alerts.md#alert-3
